name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://www.mbjewellers.in
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mb_jewellers?schema=public
  LEAD_STORAGE_MODE: postgres
  ADMIN_EMAIL: ci@example.com
  ADMIN_PASSWORD_HASH: scrypt:208141148531e3029e8547ccfd24adc3:3a8ecc29b990cda8c2e46927dc3924e4cf10d4c1c4e6b167256a74cdfdaa4c01f1dd27beebe6b21a6204f282dec27e2b4cb0a4b08e89868c74662c50713a7b3b
  ADMIN_SESSION_SECRET: ci-build-secret-minimum-32-characters-long

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run verify:build
